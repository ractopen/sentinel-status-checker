name: Check Endpoints & Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe All Render, Vercel & GitHub Pipelines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, os, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          token = os.environ.get("GITHUB_TOKEN", "")
          gh_headers = {"User-Agent": "SentinelStatusChecker/1.0", "Accept": "application/vnd.github+json"}
          if token:
              gh_headers["Authorization"] = f"Bearer {token}"

          def gh_get(url):
              try:
                  req = urllib.request.Request(url, headers=gh_headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except Exception:
                  return None

          endpoints = [
              {"id": "backend-health", "url": "https://backend-pi68.onrender.com/api/health"},
              {"id": "backend-oidc", "url": "https://backend-pi68.onrender.com/.well-known/openid-configuration"},
              {"id": "web-portal", "url": "https://web-beta-orcin-33.vercel.app/"},
              {"id": "web-login", "url": "https://web-beta-orcin-33.vercel.app/login"},
              {"id": "web-register", "url": "https://web-beta-orcin-33.vercel.app/register"},
              {"id": "sentinel-control", "url": "https://sentinel-control-green.vercel.app/"},
              {"id": "demo-acme", "url": "https://demo-apps-blue.vercel.app/"},
              {"id": "demo-fintech", "url": "https://demo-apps-sfjl.vercel.app/"},
              {"id": "demo-nexus", "url": "https://demo-apps-fjk5.vercel.app/"},
          ]

          results = []
          for ep in endpoints:
              t0 = time.time()
              code = "ERR"
              try:
                  req = urllib.request.Request(ep["url"], headers={"User-Agent": "SentinelStatusChecker/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      code = resp.status
              except urllib.error.HTTPError as e:
                  code = e.code
              except Exception:
                  code = "ERR"
              latency = round((time.time() - t0) * 1000)
              results.append({"id": ep["id"], "url": ep["url"], "httpCode": code, "latencyMs": latency})

          pipeline_repos = [
              {"id": "backend", "label": "Backend API (Render Auto-Deploy)", "repo": "Sentinal-Security/backend", "branch": "development", "platform": "Render"},
              {"id": "web", "label": "Web IAM Portal (Vercel Auto-Deploy)", "repo": "Sentinal-Security/web", "branch": "development", "platform": "Vercel"},
              {"id": "mobile", "label": "Mobile APK Builder (GitHub Actions)", "repo": "Sentinal-Security/mobile", "branch": "development", "platform": "GitHub Actions"},
              {"id": "checker", "label": "Status Checker (GitHub Pages)", "repo": "ractopen/sentinel-status-checker", "branch": "main", "platform": "GitHub Pages"},
          ]

          pipelines = []
          for p in pipeline_repos:
              runs = gh_get(f"https://api.github.com/repos/{p['repo']}/actions/runs?per_page=2")
              commit = gh_get(f"https://api.github.com/repos/{p['repo']}/commits/{p['branch']}")
              deps = gh_get(f"https://api.github.com/repos/{p['repo']}/deployments?per_page=1")

              latest_run = (runs or {}).get("workflow_runs", [None])[0] if (runs or {}).get("workflow_runs") else None
              commit_msg = ((commit or {}).get("commit", {}).get("message", "") or "No commit message").split("\n")[0]
              commit_sha = ((commit or {}).get("sha", "") or "")[:7] or "--"
              commit_date = (commit or {}).get("commit", {}).get("author", {}).get("date")

              deploy_state = None
              deploy_env = p["platform"]
              if isinstance(deps, list) and len(deps) > 0:
                  deploy_env = deps[0].get("environment") or p["platform"]
                  statuses = gh_get(deps[0].get("statuses_url", ""))
                  if isinstance(statuses, list) and len(statuses) > 0:
                      deploy_state = statuses[0].get("state")

              state = "IDLE / LIVE"
              pill_class = "pill-ok"
              summary = f"Latest code ({commit_sha}) is deployed and idle."

              if latest_run and latest_run.get("status") in ("in_progress", "queued"):
                  state = "COMPILING (GITHUB ACTION)"
                  pill_class = "pill-warn"
                  summary = f"GitHub Action '{latest_run.get('name')}' is currently {latest_run.get('status').replace('_', ' ')}."
              elif deploy_state in ("pending", "in_progress", "queued"):
                  state = f"COMPILING ({p['platform'].upper()})"
                  pill_class = "pill-warn"
                  summary = f"{deploy_env} is currently building/deploying commit {commit_sha}."
              elif deploy_state in ("failure", "error") or (latest_run and latest_run.get("conclusion") == "failure"):
                  state = "BUILD FAILED"
                  pill_class = "pill-err"
                  summary = f"Latest {p['platform']} build/deploy reported a failure."
              elif latest_run:
                  summary = f"Last workflow '{latest_run.get('name')}' finished ({latest_run.get('conclusion') or latest_run.get('status')})."

              pipelines.append({
                  "id": p["id"],
                  "label": p["label"],
                  "repo": p["repo"],
                  "branch": p["branch"],
                  "platform": p["platform"],
                  "state": state,
                  "pillClass": pill_class,
                  "summary": summary,
                  "latestCommitSha": commit_sha,
                  "latestCommitMsg": commit_msg,
                  "latestCommitDate": commit_date,
                  "runUrl": (latest_run or {}).get("html_url") or f"https://github.com/{p['repo']}/actions",
              })

          payload = {
              "checkedAt": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"),
              "results": results,
              "pipelines": pipelines,
          }
          with open("status.json", "w") as f:
              json.dump(payload, f, indent=2)
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
